<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="description" content="Links to independent webapps by Jaeseo" />
    <title>Chamfered - App Directory</title>
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;1,100;1,200&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body,
      section {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <section class="min-h-screen flex items-center justify-center py-10 px-12">
      <!-- Card Grid -->
      <div class="grid grid-flow-row gap-8 text-neutral-600 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 w-full max-w-7xl">
        <!-- Coffee Article 1 -->
        <div class="rounded shadow-lg shadow-gray-200 dark:shadow-gray-900 bg-white dark:bg-gray-800 duration-300 hover:-translate-y-1">
          <a href="https://aperture.chamfered.dev" target="_blank" rel="noopener noreferrer" class="cursor-pointer block h-full">
            <div class="p-6 flex flex-col h-full">
              <p class="text-lg mb-4 font-bold leading-relaxed text-gray-800 dark:text-gray-300">Variable Aperture Visualizer</p>
              <small class="leading-5 text-gray-500 dark:text-gray-400">Visualize and compare how variable-aperture zoom lenses change aperture across focal lengths</small>
            </div>
          </a>
        </div>

        <!-- Coffee Article 2 -->
        <div class="rounded shadow-lg shadow-gray-200 dark:shadow-gray-900 bg-white dark:bg-gray-800 duration-300 hover:-translate-y-1">
          <a href="https://grey.chamfered.dev" target="_blank" rel="noopener noreferrer" class="cursor-pointer block h-full">
            <div class="p-6 flex flex-col h-full">
              <p class="text-lg mb-4 font-bold leading-relaxed text-gray-800 dark:text-gray-300">Grey</p>
              <small class="leading-5 text-gray-500 dark:text-gray-400">An image editor for scanned greyscale images like receipts</small>
            </div>
          </a>
        </div>

        <!-- Waypoints -->
        <div class="rounded shadow-lg shadow-gray-200 dark:shadow-gray-900 bg-white dark:bg-gray-800 duration-300 hover:-translate-y-1">
          <a href="https://waypoints.chamfered.dev" target="_blank" rel="noopener noreferrer" class="cursor-pointer block h-full">
            <div class="p-6 flex flex-col h-full">
              <p class="text-lg mb-4 font-bold leading-relaxed text-gray-800 dark:text-gray-300">Waypoints</p>
              <small class="leading-5 text-gray-500 dark:text-gray-400">A thin coordinate manager for Google Maps</small>
            </div>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
